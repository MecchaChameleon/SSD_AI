  <text x="120" y="815" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#1E3A8A">페르소나 보정 규칙은 학습형 LinUCB 대비 매출 99.5%, 폐기 반영 순이익 99.2% 수준을 유지하면서 재고 소진율을 개선</text>
